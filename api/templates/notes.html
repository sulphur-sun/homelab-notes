<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список заметок</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        .note { border: 1px solid #ccc; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
        .note h2 { margin: 0 0 .5rem; }
        .empty { color: #888; font-style: italic; }
    </style>
</head>
<body>
    <h1>Заметки</h1>

    {{ if . }}
        {{ range . }}
            <div class="note">
                <h2>{{ .Name }}</h2>
                <p>{{ .Text }}</p>

                <form action="http://localhost:8091/delete/{{ .Id }}" method="POST"
                    onsubmit="return confirm('Удалить эту заметку?');"
                    style="display:inline">
                    <button type="submit" class="btn btn-danger">Удалить</button>
                </form>
            </div>
        {{ end }}
    {{ else }}
        <p class="empty">Заметок пока нет.</p>
    {{ end }}

    <a href="http://localhost:8090/new" class="btn">new note</a>
</body>
</html>
